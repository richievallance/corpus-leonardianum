name: Google Drive corpus manifest

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: drive-api-sync
  cancel-in-progress: false

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-drive-sync.txt

      - name: Install dependencies
        run: pip install -r requirements-drive-sync.txt

      - name: Read Drive through API and build manifest
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_CORPUS_FOLDER_ID: 12VfWJgjtU-9JbU6x71KiTeZ8FBT8JhuB
          DRIVE_MANIFEST_OUTPUT: manifests/drive-corpus-manifest.json
        run: python tools/drive_sync.py

      - name: Commit changed manifest
        run: |
          if git diff --quiet -- manifests/drive-corpus-manifest.json; then
            echo "No manifest changes"
            exit 0
          fi
          git config user.name "corpus-leonardianum-bot"
          git config user.email "actions@users.noreply.github.com"
          git add manifests/drive-corpus-manifest.json
          git commit -m "Update Google Drive corpus manifest"
          git push
